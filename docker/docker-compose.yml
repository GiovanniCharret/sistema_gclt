services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile-backend
    env_file:
      - ../backend/.env
    expose:
      - "8000"
    networks:
      - app-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - app-network  

networks:
  app-network:
    driver: bridge

