server {
    listen 80;
    server_name monitoramentolpt.enbpar.gov.br;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: rotas do front caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API do backend — nome do serviço no docker-compose (rede interna do Docker),
    # não 127.0.0.1: front e backend rodam em containers separados.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }
}
